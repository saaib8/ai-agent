# How many people a seating type seats by its nature. Version v1.
#
# Reviewed domain data, not a runtime guess (docs/known-issues.md, issue 4
# decision; CLAUDE.md 6.2, 31). In store 50 not one chair or single-seater sofa
# records a `seating_capacity`, so without this a seat count could never be
# answered for them - and every stocked sofa, sofa set, sofa bed and sectional
# seats two or more.
#
# `recliner` and `chaise-lounge` are deliberately in neither list: some seat
# two or three, and the review has not settled them. Absence means unknown,
# never one. Adding a type: only after a reviewer confirms every product of it.
version: v1

# The seat count one piece of each type has when the catalog records none.
# Never applied over a count the catalog does record. A type here seating one
# is never given a seat filter, and fills one seat in a combination.
implied_capacity:
  chair: 1
  dining-chair: 1
  lounge-chair: 1
  office-chair: 1
  outdoor-chair: 1
  stool: 1
  single-seater-sofa: 1

# Each seats two or more, so "one seat" of these is a different product type.
multi_seat:
  - sofa
  - sectional-sofa
  - sofa-set
  - sofa-bed

# The multi-seat types a seating combination is built around. A sofa bed seats
# several too, but is only used when the customer asked for sofa beds - nobody
# asking for sofas for eight wants one they did not mention. Confirmed by the
# user 2026-09-26.
combination_main:
  - sofa
  - sectional-sofa
  - sofa-set

# One-seat types that may add seats beside the main pieces, for a living
# space. Office chairs, stools, dining and outdoor chairs seat one too, but
# belong in other rooms. Confirmed by the user 2026-09-26.
combination_extras:
  - chair
  - lounge-chair
  - single-seater-sofa
