          - {en: "Chenille", ar: "شنيل (Chenille)"}
          - {en: "Genuine leather", ar: "جلد طبيعي", match: [genuine leather, real leather, natural leather, top grain, full grain]}
          - {en: "Faux leather", ar: "جلد صناعي", match: [faux leather, pu leather, vegan leather, leatherette, synthetic leather]}
          - {en: "Stain-resistant, easy-clean fabric", ar: "قماش مقاوم للبقع وسهل التنظيف"}
          - {en: "Soft plush fabric", ar: "قماش ناعم ووبري"}
