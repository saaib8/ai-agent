# What to ask before searching for a sub-category, from "ZORY Product Search"
# (CLAUDE.md 10.4, `customer_agent.subcategory_questions`).
#
# "I need a recliner" is answered with one card: this sub-category's own
# questions, all at once, before any product is shown. The sheet decides what
# is asked; the catalog decides the chips wherever it has the data:
#
#   ask: type     the kind of piece. An option naming a `subcategory` (with a
#                 seat count where it names one) switches the search to it and
#                 is offered only where the store stocks it; an option naming
#                 none only ranks, by its `words` (its English label unless
#                 given).
#   ask: people   how many it must seat: the head count of CLAUDE.md 10.5 -
#                 pieces that seat that many first, a combination for more
#                 than any one piece seats. Where the store records no seat
#                 counts for the type, the options only rank ("6 seater").
#   ask: colour   the catalog's own colours for the type, most products first,
#                 up to three ticked. Where the sheet asks "which color or
#                 pattern", its words are this question's `options`, offered
#                 beside the colours as one question (`options_first: true`
#                 where the sheet lists them before the colours).
#   ask: budget   bands cut from the store's real prices. No options here.
#   ask: detail   a material, a feature, a shape, a size, a pattern, a use:
#                 words that rank and never filter. The catalog records none
#                 of these (CLAUDE.md 5), so nothing is hidden and the reply
#                 never says a piece is made of or has one. `multi: true`
#                 allows up to three ticks.
#
# Each question shows at most eight chips: the most-stocked first where the
# catalog can count them (types, colours), the order below otherwise. Options
# that add nothing - "Not sure", "No preference", "All colors", "Other ..." -
# are left out: every question is optional, and the card can be skipped.
#
# An option that only ranks (a detail, or a type naming no `subcategory`) is
# offered only where the store's product names carry its words
# (`customer_agent.subcategory_chips_from_names`), the most-named first. Every
# question is still asked: one whose names back fewer than two of its options
# is asked with the options below, the backed ones first.
#
#   match         the words to look for, any one enough - a store's own way of
#                 naming the thing ("gas lift" for lift-up storage, "dhurry"
#                 for flatweave). English letters, digits, spaces and hyphens,
#                 or Arabic letters; whole words with their plural. Without it,
#                 the label's own words less the type's nouns, stop words and
#                 figures ("Bed with storage drawers" looks for "storage
#                 drawers"). Only real synonyms: a word that names something
#                 else would offer a chip the store does not sell.
#
#   for           the sub-categories a row is asked for, one row each
#   for_category  categories whose search named no kind - "I need a table" -
#                 that the row answers; it must ask the type
#   noun          what the card's button names, when the sub-category's own
#                 name would not read well
#
# Left out on purpose, and asked as before (`briefs_v1.yaml`): lounge-chair,
# until its options are reviewed. Brand questions are left out until the
# catalog records a brand. Differences from the sheet, reviewed: the pendant
# and outdoor lighting answers were swapped back, chandelier's questions
# reworded, and plate's second question asks the material its answers list.
#
# Every question and label has its Arabic beside it, from the sheet's Arabic
# tab.

version: v1

rows:
  chair:
    for: [chair]
    noun: {en: "chairs", ar: "الكراسي"}
    questions:
      - ask: type
        q: {en: "What type of chair are you looking for?", ar: "أي نوع من الكراسي تبحث عنه؟"}
        options:
          - {en: "Office chair", ar: "كرسي مكتب", subcategory: office-chair}
          - {en: "Dining chair", ar: "كرسي طعام", subcategory: dining-chair}
          - {en: "Lounge chair", ar: "كرسي استرخاء", subcategory: lounge-chair}
          - {en: "Armchair", ar: "كرسي بذراعين", match: [armchair, arm chair, armrest, with arms]}
          - {en: "Armless chair", ar: "كرسي بدون ذراعين"}
          - {en: "Rocking chair", ar: "كرسي هزاز"}
          - {en: "Outdoor chair", ar: "كرسي خارجي", subcategory: outdoor-chair}
          - {en: "Bar / High chair", ar: "كرسي مرتفع", subcategory: stool, words: "bar high chair"}
          - {en: "Single sofa chair", ar: "كرسي كنب مفرد", subcategory: single-seater-sofa}
      - ask: colour
        q: {en: "Which color do you prefer?", ar: "أي لون تفضّل؟"}
      - ask: budget
        q: {en: "What's your approximate budget?", ar: "كم ميزانيتك التقريبية؟"}
  dining-chair:
    for: [dining-chair]
    questions:
      - ask: detail
        q: {en: "Which type or design of dining chair do you prefer?", ar: "أي نوع أو تصميم كرسي طعام تفضّل؟"}
        options:
          - {en: "Fabric upholstered", ar: "مبطن بالقماش", match: [upholstered, fabric]}
          - {en: "Leather / Faux leather", ar: "جلد / جلد صناعي", match: [leather, pu leather, leatherette]}
          - {en: "Wooden", ar: "خشبي", match: [wooden, wood]}
          - {en: "Metal", ar: "معدني", match: [metal, iron, steel, brass, aluminium, aluminum]}
          - {en: "With arms", ar: "بذراعين", match: [arms, armrest, armchair]}
          - {en: "Armless", ar: "بدون ذراعين"}
      - ask: colour
        q: {en: "Which color do you prefer?", ar: "أي لون تفضّل؟"}
      - ask: budget
        q: {en: "What's your approximate budget?", ar: "كم ميزانيتك التقريبية؟"}
  office-chair:
    for: [office-chair]
    questions:
      - ask: detail
        q: {en: "What's the most important feature in an office chair?", ar: "ما أهم ميزة في كرسي المكتب؟"}
        options:
          - {en: "Back support", ar: "دعم الظهر", match: [lumbar, back support, ergonomic]}
          - {en: "Adjustable height and armrests", ar: "قابلية تعديل الارتفاع والمساند", match: [adjustable]}
          - {en: "Breathable mesh", ar: "شبك للتهوية", match: [mesh]}
          - {en: "Padded executive chair", ar: "كرسي تنفيذي مبطن", match: [executive, padded]}
          - {en: "Comfortable", ar: "مريح"}
      - ask: detail
        q: {en: "Which material do you prefer?", ar: "أي خامة تفضّل؟"}
        multi: true
        options:
          - {en: "Mesh", ar: "شبك"}
          - {en: "Fabric", ar: "قماش"}
          - {en: "Leather / Faux leather", ar: "جلد / جلد صناعي", match: [leather, pu leather, leatherette]}
      - ask: budget
        q: {en: "What's your approximate budget?", ar: "كم ميزانيتك التقريبية؟"}
  recliner:
    for: [recliner]
    questions:
      - ask: detail
        q: {en: "Which type of recliner do you prefer?", ar: "أي نوع كرسي استرخاء تفضّل؟"}
        options:
          - {en: "Manual recliner", ar: "كرسي استرخاء يدوي"}
          - {en: "Power (electric) recliner", ar: "كرسي استرخاء كهربائي"}
          - {en: "Swivel recliner", ar: "كرسي دوّار مع إمالة"}
          - {en: "Rocker recliner", ar: "كرسي هزاز مع إمالة"}
          - {en: "Space-saving wall-hugger recliner", ar: "كرسي استرخاء جداري موفر للمساحة"}
          - {en: "Lift recliner", ar: "كرسي استرخاء يساعد على الوقوف (Lift Recliner)"}
          - {en: "Zero-gravity recliner", ar: "كرسي استرخاء بوضعية انعدام الجاذبية (Zero Gravity)"}
      - ask: detail
        q: {en: "Which features matter to you in a recliner?", ar: "أي مميزات تهمك في كرسي الاسترخاء؟"}
        multi: true
        options:
          - {en: "Back recline", ar: "إمالة الظهر"}
          - {en: "Footrest lift", ar: "رفع مسند القدم"}
          - {en: "Independent back and foot adjustment", ar: "تعديل الظهر والقدم بشكل مستقل"}
          - {en: "Near-flat recline for sleeping", ar: "إمالة شبه كاملة للنوم"}
          - {en: "Massage", ar: "مساج"}
          - {en: "Heating", ar: "تدفئة"}
          - {en: "Adjustable headrest", ar: "مسند رأس قابل للتعديل"}
          - {en: "Lumbar support", ar: "دعم أسفل الظهر"}
          - {en: "USB / Charging ports", ar: "منافذ USB / شحن"}
          - {en: "Cup holder", ar: "حامل أكواب"}
          - {en: "Remote control", ar: "تحكم عن بُعد"}
      - ask: budget
        q: {en: "What's your approximate budget?", ar: "كم ميزانيتك التقريبية؟"}
  stool:
    for: [stool]
    questions:
      - ask: detail
        q: {en: "Where will you use the stool?", ar: "وين بتستخدم المقعد؟"}
        options:
          - {en: "Kitchen counter", ar: "كاونتر مطبخ"}
          - {en: "High bar", ar: "بار مرتفع"}
          - {en: "Vanity / Dressing table", ar: "تسريحة"}
          - {en: "Extra seating", ar: "مقعد إضافي"}
      - ask: detail
        q: {en: "Which stool shape do you prefer?", ar: "أي شكل مقعد تفضّل؟"}
        options:
          - {en: "Backless", ar: "بدون ظهر"}
          - {en: "With back", ar: "بظهر"}
          - {en: "With back and arms", ar: "بظهر وذراعين"}
          - {en: "Round", ar: "دائري"}
          - {en: "Square", ar: "مربع"}
      - ask: budget
        q: {en: "What's your approximate budget?", ar: "كم ميزانيتك التقريبية؟"}
  outdoor-chair:
    for: [outdoor-chair]
    questions:
      - ask: detail
        q: {en: "Which type of outdoor chair do you prefer?", ar: "أي نوع كرسي خارجي تفضّل؟"}
        options:
          - {en: "Wide, comfortable lounge chair", ar: "كرسي استرخاء واسع ومريح"}
          - {en: "Standard patio chair", ar: "كرسي جلسة عادي"}
          - {en: "Foldable, portable chair", ar: "كرسي قابل للطي والتنقل"}
          - {en: "Rocking chair", ar: "كرسي هزاز"}
          - {en: "Reclining chair", ar: "كرسي استلقاء"}
          - {en: "Synthetic wicker", ar: "مصنوع من خوص صناعي"}
          - {en: "Wood", ar: "خشب"}
          - {en: "Metal", ar: "معدن", match: [metal, iron, steel, brass, aluminium, aluminum]}
          - {en: "Plastic", ar: "بلاستيك"}
      - ask: detail
        q: {en: "What's the most important feature for you in the chair?", ar: "وش أهم ميزة تهمك في الكرسي؟"}
        options:
          - {en: "Heat and sun resistant", ar: "مقاوم للحرارة والشمس"}
          - {en: "Water and humidity resistant", ar: "مقاوم للماء والرطوبة"}
          - {en: "Easy to clean and stain-resistant", ar: "سهل التنظيف ومقاوم للبقع"}
          - {en: "Lightweight and easy to move", ar: "خفيف وسهل النقل"}
          - {en: "Durable for daily use", ar: "متين ويتحمل الاستخدام اليومي"}
      - ask: budget
        q: {en: "What's your approximate budget?", ar: "كم ميزانيتك التقريبية؟"}
  single-seater-sofa:
    for: [single-seater-sofa]
    questions:
      - ask: detail
        q: {en: "Which type of single sofa chair do you prefer?", ar: "أي نوع كرسي كنب مفرد تفضّل؟"}
        options:
          - {en: "With arms", ar: "بذراعين", match: [arms, armrest]}
          - {en: "Armless", ar: "بدون ذراعين"}
          - {en: "Swivel", ar: "دوّار"}
          - {en: "Wide and padded", ar: "عريض ومبطن", match: [oversized, wide padded, extra wide]}
      - ask: colour
        q: {en: "Which color do you prefer?", ar: "أي لون تفضّل؟"}
        options:
          - {en: "Multicolor", ar: "ألوان متعددة"}
          - {en: "Solid", ar: "سادة"}
          - {en: "Striped", ar: "مخطط"}
          - {en: "Floral", ar: "مورّد"}
          - {en: "Button-tufted upholstery", ar: "تنجيد مبطن بأزرار", match: [button tufted, buttoned]}
          - {en: "Contrast stitching", ar: "خياطة بارزة"}
      - ask: budget
        q: {en: "What's your approximate budget?", ar: "كم ميزانيتك التقريبية؟"}
  sofa:
    for: [sofa]
    noun: {en: "sofas", ar: "الكنب"}
    questions:
      - ask: type
        q: {en: "Which sofa type or shape do you prefer?", ar: "أي نوع أو شكل كنب تفضّل؟"}
        options:
          - {en: "Straight sofa", ar: "كنب مستقيم"}
          - {en: "L-shaped corner sofa", ar: "كنب زاوية L", subcategory: sectional-sofa}
          - {en: "U-shaped sofa", ar: "كنب شكل U", subcategory: sectional-sofa, words: "U-shaped sofa"}
          - {en: "Curved / Round sofa", ar: "كنب منحني / دائري"}
          - {en: "Modular sofa", ar: "كنب وحدات قابلة للتغيير (Modular)"}
          - {en: "Single-seat sofa", ar: "كنب مفرد", subcategory: single-seater-sofa}
          - {en: "2-seater sofa", ar: "كنب لشخصين", subcategory: sofa, seats: 2}
          - {en: "3-seater sofa", ar: "كنب 3 مقاعد", subcategory: sofa, seats: 3}
          - {en: "Large 4–6 seater sofa", ar: "كنب كبير 4–6 مقاعد", subcategory: sofa, min_seats: 4}
          - {en: "Separate sofa set", ar: "طقم كنب منفصل", subcategory: sofa-set}
          - {en: "Low and deep sofa", ar: "كنب منخفض وعميق"}
      - ask: colour
        q: {en: "Which color do you prefer?", ar: "أي لون تفضّل؟"}
        options:
          - {en: "Multicolor", ar: "متعدد الألوان"}
          - {en: "Solid", ar: "سادة"}
          - {en: "Striped", ar: "مخطط"}
          - {en: "Floral", ar: "مورّد"}
          - {en: "Geometric", ar: "هندسي"}
      - ask: detail
        q: {en: "Which material or upholstery type do you prefer?", ar: "أي خامة أو نوع تنجيد تفضّل؟"}
        multi: true
        options:
          - {en: "Linen", ar: "كتان"}
          - {en: "Cotton", ar: "قطن"}
          - {en: "Velvet", ar: "مخمل"}
          - {en: "Chenille", ar: "شنيل"}
          - {en: "Bouclé", ar: "بوكلية"}
          - {en: "Genuine leather", ar: "جلد طبيعي", match: [genuine leather, real leather, natural leather, top grain, full grain]}
          - {en: "Faux leather", ar: "جلد صناعي", match: [faux leather, pu leather, vegan leather, leatherette, synthetic leather]}
          - {en: "Soft plush fabric", ar: "قماش ناعم ووبري"}
          - {en: "Stain-resistant fabric", ar: "قماش مقاوم للبقع"}
          - {en: "Easy-clean fabric", ar: "قماش سهل التنظيف"}
          - {en: "Water-resistant fabric", ar: "قماش مقاوم للماء"}
  chaise-lounge:
    for: [chaise-lounge]
    questions:
      - ask: detail
        q: {en: "Which chaise lounge design do you prefer?", ar: "أي تصميم شيزلونج تفضّل؟"}
        options:
          - {en: "Right-arm", ar: "بذراع على اليمين"}
          - {en: "Left-arm", ar: "بذراع على اليسار"}
          - {en: "Two arms", ar: "بذراعين"}
          - {en: "Armless", ar: "بدون ذراعين"}
          - {en: "High back", ar: "ظهر مرتفع"}
          - {en: "Low back", ar: "ظهر منخفض"}
          - {en: "Curved back", ar: "ظهر منحني"}
          - {en: "Classic design with raised end", ar: "تصميم كلاسيكي بطرف مرتفع"}
          - {en: "Straight modern design", ar: "تصميم مودرن مستقيم"}
          - {en: "Round / Curved design", ar: "تصميم دائري / منحني"}
          - {en: "With storage", ar: "مع مساحة تخزين"}
      - ask: colour
        q: {en: "Which color do you prefer?", ar: "أي لون تفضّل؟"}
        options:
          - {en: "Multicolor", ar: "ألوان متعددة"}
          - {en: "Solid", ar: "سادة"}
          - {en: "Striped", ar: "مخطط"}
          - {en: "Floral", ar: "مورّد"}
          - {en: "Button-tufted upholstery", ar: "تنجيد مبطن بأزرار", match: [button tufted, buttoned]}
