name: Main Deploy ECS CICD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  REGION: ap-south-1
  OIDC_ROLE_ARN: arn:aws:iam::047719637331:role/ai-chat-agent-oidc-role
  ECR_REPOSITORY: zory/ai-chat-agent
  AI_CHAT_AGENT_TASK_DEFINITION: prod-zory-ai-chat-agent-tg
  AI_CHAT_AGENT_CONTAINER_NAME: prod-zory-ai-chat-agent-container
  AI_CHAT_AGENT_SERVICE_NAME: prod-zory-ai-chat-agent
  AI_CHAT_AGENT_CLUSTER_NAME: prod-zory-cluster

jobs:
  build-and-push:
    name: Build and push to ECR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS creds (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.REGION }}
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Building and pushing $IMAGE"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy-ai-agent:
    name: Deploy to ECS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS creds (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.REGION }}
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$AI_CHAT_AGENT_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > task-definition.json

      - name: Fill in the new image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.AI_CHAT_AGENT_CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.image }}

      - name: Deploy AI agent service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.AI_CHAT_AGENT_SERVICE_NAME }}
          cluster: ${{ env.AI_CHAT_AGENT_CLUSTER_NAME }}
          wait-for-service-stability: true