# Live conversation cases for the "never an error" work (docs/known-issues.md,
# issue 6 and the colour decisions). Each case is a short conversation; the
# checks apply to the reply to its LAST message.
#
# These call the real model, catalog, index and Redis, so they are an
# evaluation, never part of pytest. The model is not deterministic: a check
# that fails once is signal to look at, not proof.
#
# Checks:
#   not_fallback          the reply is not the "didn't catch that" fallback
#   min_products: N       at least N product cards
#   max_price: X          every card costs at most X
#   colors_subset: [...]  every card's colour is one of these
#   top_colors_any: {n, colors}  at least one of the first n cards has one
#   min_distinct_colors: N  the cards span at least N colours (no hard filter)
#   engages               a comparison, products, or a question - not a dead end
#   new_products          none of the cards repeat the previous turn
#   drops_previous_card: N  card N of the previous turn is gone, and cards are shown
#   subcategory: key      every card is this commerce subcategory
#   admits_no_match       the reply says plainly that nothing matched exactly
#   mentions: [...]       the reply mentions at least one of these words
#   max_products: N       at most N product cards (0 = it asked before showing)
#   min_combinations: N   at least N seating combinations on screen
#   follow_up_mentions: [...]  the optional follow-up question mentions one of these
#   new_combinations      none of the combinations repeat the previous turn
#   drops_previous_combination: N  combination N is gone, the others kept
#   max_dimension: {field, value}         every card's field (e.g. length_cm) is at most value
#   some_dimension_above: {field, value}  at least one card's field is above value
#   piece_picker          the room's pieces are shown as chips
#   room_status: s        the room package has this status (complete / partial)
#   room_has: [...]       the room holds each of these subcategories
#   room_seats: N         the room's seating adds up to exactly N seats
#   not_mentions: [...]   the reply mentions none of these
#   combination_excludes: key  no combination uses this subcategory
#   room_locked: N        the room holds exactly N locked pieces (the customer's picks)
#   room_type_max: {type: N}  the room holds at most N of each listed type
#
# Product discovery (question card, picks, cross-sell, comparison):
#   card: true|false      a question card is (not) asked before searching
#   no_card: true         no card at all, not even folded beside the results
#   card_mode: ask|narrow the card is asked first, or folded as "Narrow down"
#   narrow_down: true|false  Narrow down is (not) beside the results
#   brief_chips_include / brief_chips_exclude: [...]  the brief chips name / no longer name these facets
#   opening: N            an opening is shown asking exactly N questions
#   opening_never: [...]  the opening asks none of these (e.g. budget, room)
#   card_asks: [...]      the card asks these (type budget colour feel style)
#   card_skips: [...]     the card does not ask these - they were already said
#   card_first: kind      the card's first question
#   card_kinds_include: [...]  the "What kind?" question offers these labels
#   best_match: true|false  the first card is (not) labelled the best match
#   picks: N              the tray holds N picks after the turn
#   cross_sell: true|false  the pick is (not) shown with what goes with it
#   offer: true|false     the pick is (not) offered the kinds that go with it:
#                         its card, the kinds as chips and "No thanks", nothing
#                         searched
#   chips_include: [...]  the chips under the reply include these labels
#   shows_with_pick: true|false  the pick's card is shown with products of another
#                         kind beneath it - what goes with it, chosen by the
#                         design specialist (CLAUDE.md 10.4)
#   silent_tick: true     the tick saved the pick and started no turn
#   next_step: true       never a dead end: the reply asks a question and offers
#                         chips (or a card) that answer it
#   seats: N / min_seats: N  every card seats exactly N / at least N
#   subcategory_in: [...] every card is one of these types
#   not_subcategory: key  no card is this type
#   within_chosen_budget  every card is inside the budget band tapped
#   comparison: true      a comparison table is shown
#   popup: true           the pop-up compared the products, with a take
#   popup_columns: N      ... and it had N columns (default 2)
#   popup_refused: true   the pop-up refused - two different kinds of product
#   no_follow_up: true    the reply asks no question of its own
#   companion_chips_min: N  at least N chips of kinds that go with the pick
#   card_kind_first: label  the kind the store has most of leads "What kind?"
#   first_chip: label     the first chip under the reply
#
# A turn is either the customer's words, or a tap made the way the console
# makes it, with keys and positions read from the replies before it:
#   {answer_card: {piece: 3-seater, budget: 2, colours: [Beige], styles: [Modern],
#                  feel: Bouclé}}   labels, or a 1-based position; any may be left out
#   {answer_card: {stale: true, ...}}  answer a card number that is not on screen
#   {answer_card: {each_first: true}}  tap the first answer of every question shown
#   {narrow: {...}}       answer Narrow down, as answer_card answers the card
#   {drop: facet}         tap ✕ on the brief chip with this facet
#   {skip_card: true}     "Just show me ..." with nothing tapped
#   {search: "show me sofas"}  say it, then skip the card of questions if one
#                         comes first - for cases about what happens after the
#                         results, since every new search for a kind of product
#                         now asks its card first
#   {tick: N} / {tick: {ordinal: N, grid: -2}}  tick card N on the latest result
#                         grid, or an earlier one (-2 = the grid before). A first
#                         pick of its kind is followed by "what goes with it",
#                         exactly as the console does
#   {untick: N}           remove pick N from the tray
#   {goes_with: N}        the tray's "Goes with" on pick N
#   {compare: [A, B]}     compare picks A and B (the old tray action; the API keeps it)
#   {compare_cards: [{ordinal: 1}, {ordinal: 3, grid: -2}]}  check Compare on two
#                         or more cards - the pop-up comparison, read only
#   {chip: "Rugs"}        tap a chip under the last reply
#   {more_options: true}  "Show me different options"
#   {not_this_one: N}     "Not this one" on card N

cases:
  - id: B1_only_beige_followup
    issue: "502 case B1"
    turns: [{search: "show me sofas"}, "only beige ones"]
    checks: {not_fallback: true, min_products: 1, colors_subset: [Beige]}

  - id: dark_grey_followup
    issue: "issue 2"
    turns: [{search: "show me sofas"}, "show me some dark grey shades"]
    checks:
      not_fallback: true
      min_products: 1
      top_colors_any: {n: 3, colors: [Grey, Charcoal, Black]}

  - id: B3_price_with_comma
    issue: "502 case B3"
    turns: [{search: "show me sofas"}, "under 5,000 SAR please"]
    checks: {not_fallback: true, min_products: 1, max_price: 5000}

  - id: B4_price_shorthand
    issue: "502 case B4"
    turns: [{search: "show me sofas"}, "anything under 5k SAR?"]
    checks: {not_fallback: true, min_products: 1, max_price: 5000}

  - id: A2_percent_cheaper
    issue: "502 case A2"
    turns: [{search: "show me sofas"}, "show me something 20% cheaper than the second one"]
    checks: {not_fallback: true, engages: true}

  - id: A4_compare_one
    issue: "502 case A4"
    turns: [{search: "show me sofas"}, "compare the second one"]
    checks: {not_fallback: true, engages: true}

  - id: only_reddish_followup
    issue: "strict colour nothing fits (stage D: closest instead of a dead end)"
    turns: [{search: "show me sofas"}, "only reddish ones please"]
    checks: {not_fallback: true, min_products: 1, admits_no_match: true}

  - id: only_red_new_search
    issue: "strict colour the store lacks (stage D)"
    turns: [{search: "only red sofas please, no other colours"}]
    checks: {not_fallback: true, min_products: 1, admits_no_match: true}

  - id: only_purple_followup
    issue: "strict colour the store lacks (stage D)"
    turns: [{search: "show me sofas"}, "only purple ones"]
    checks: {not_fallback: true, min_products: 1, admits_no_match: true}

  - id: cheapest_beige
    issue: "matching first with an explicit sort (stage D)"
    turns: [{search: "show me the cheapest beige sofas"}]
    checks: {min_products: 1, top_colors_any: {n: 1, colors: [Beige]}}

  - id: A1_show_more_typed
    issue: "issue 7 (typed 'show more options')"
    turns: [{search: "show me sofas"}, "show more options"]
    checks: {not_fallback: true, new_products: true}

  - id: not_this_one_typed
    issue: "issue 7 (typed 'not this one')"
    turns: [{search: "show me sofas"}, "I don't like the second one, show me others"]
    checks: {not_fallback: true, drops_previous_card: 2}

  - id: A9_take_that_one
    issue: "502 case A9"
    turns: [{search: "show me sofas"}, "I'll take that one"]
    checks: {not_fallback: true}

  - id: C1_room_budget_shorthand
    issue: "502 case C1"
    turns: ["I want to furnish my living room, my budget is 12k SAR"]
    checks: {not_fallback: true, engages: true}

  - id: C2_room_length_corrected
    issue: "502 case C2"
    turns: ["My living room is 4 m long, actually no, 5 m long. Help me plan it, budget 15000 SAR"]
    checks: {not_fallback: true, engages: true}

  - id: A6_majlis_40_people
    issue: "502 case A6 (limit raised to 200)"
    turns: ["we are 40 people, it's for a majlis, show me sofas"]
    checks: {not_fallback: true}

  - id: darker_new_search
    issue: "colour set mapping"
    turns: [{search: "show me darker sofas"}]
    checks:
      min_products: 1
      top_colors_any: {n: 3, colors: [Grey, Charcoal, Black, Navy, Espresso, Forest Green, Walnut]}

  - id: warm_tones_new_search
    issue: "colour set mapping"
    turns: [{search: "show me sofas in warm tones"}]
    checks:
      min_products: 1
      top_colors_any: {n: 3, colors: [Beige, Sand, Taupe, Terracotta, Clay, Mustard, Burnt Orange, Ivory]}

  - id: only_dark_grey_new_search
    issue: "strict colour set"
    turns: [{search: "only dark grey sofas, nothing else"}]
    checks: {min_products: 1, colors_subset: [Grey, Charcoal, Black]}

  - id: cozy_lighter_followup
    issue: "issue 5"
    turns: [{search: "show me sofas"}, "something cozy in a lighter shade"]
    checks: {not_fallback: true, min_products: 1, min_distinct_colors: 2}

  - id: control_sofas_under_5000
    issue: "control"
    turns: [{search: "show me sofas under 5000 SAR"}]
    checks: {min_products: 1, max_price: 5000}

  - id: control_coffee_table
    issue: "control"
    turns: [{search: "show me a coffee table"}]
    checks: {min_products: 1}

  # ── carry-forward: what the customer already said must survive follow-ups ──
  - id: carry_budget_through_type_change
    issue: "carry-forward (budget survives a type change and a sort)"
    turns: [{search: "show me sofas under 5000 SAR"}, {search: "show me sectional ones instead"}, "cheapest first"]
    checks: {not_fallback: true, min_products: 1, max_price: 5000, subcategory: sectional-sofa}

  - id: carry_colour_through_price_change
    issue: "carry-forward (strict colour survives a price change)"
    turns: [{search: "only beige sofas under 5000 SAR"}, "under 4000 please"]
    checks: {not_fallback: true, min_products: 1, max_price: 4000, colors_subset: [Beige]}

  - id: carry_colour_after_show_more
    issue: "carry-forward (colour survives show more, then a price change starts fresh)"
    turns: [{search: "only beige sofas"}, "show more options", "under 3000 SAR"]
    checks: {not_fallback: true, min_products: 1, max_price: 3000, colors_subset: [Beige]}

  - id: carry_mixed_red_or_beige
    issue: "mixed strict colours (red or beige)"
    turns: [{search: "only red or beige sofas"}]
    checks: {not_fallback: true, min_products: 1, colors_subset: [Beige, Ruby, Terracotta, Burnt Orange]}

  - id: carry_style_unmatched
    issue: "strict style no approved value expresses"
    turns: [{search: "sofas that must be modern and cottagecore"}]
    checks: {not_fallback: true, min_products: 1, admits_no_match: true}

  - id: type_change_red_tables
    issue: "type change with an unmatched strict colour"
    turns: [{search: "show me coffee tables"}, "make them red ones instead"]
    checks: {not_fallback: true, min_products: 1, admits_no_match: true}

  - id: dropped_width_disclosed
    issue: "a measurement dropped on a type change must be disclosed (sofa sets have no single footprint)"
    turns: [{search: "show me sofas around 220 cm wide"}, {search: "make them sofa sets instead"}]
    checks: {not_fallback: true, min_products: 1, subcategory: sofa-set, mentions: [width, wide, size, space, fit]}

  # ── sizes belong to a product type (they never follow the customer to another) ──
  - id: side_table_size_not_carried
    issue: "a side-table size must not limit coffee tables"
    turns: [{search: "side tables no wider than 50 cm please"}, {search: "show me coffee tables instead"}]
    checks: {not_fallback: true, min_products: 4, subcategory: center-table, some_dimension_above: {field: length_cm, value: 50}}

  - id: sofas_again_keeps_the_type
    issue: "known issue 19: 'show me sofas again' after another kind shows sofas, never the whole seating category"
    turns: ["just show me sofas", "just show me coffee tables", "show me sofas again, just show me"]
    checks: {not_fallback: true, min_products: 3, subcategory: sofa}

  - id: sofa_size_comes_back
    issue: "a type's size comes back when the customer returns to it, and is mentioned"
    turns: [{search: "show me sofas no wider than 200 cm"}, {search: "show me armchairs instead"}, {search: "ok, back to sofas please"}]
    checks: {not_fallback: true, min_products: 1, subcategory: sofa, max_dimension: {field: length_cm, value: 200}, mentions: [width, wide, size, earlier, limit]}

  - id: sofa_any_size_clears
    issue: "any size drops the saved limit"
    turns: [{search: "show me sofas no wider than 200 cm"}, {search: "show me armchairs instead"}, {search: "back to sofas, any size is fine"}]
    checks: {not_fallback: true, min_products: 1, subcategory: sofa, some_dimension_above: {field: length_cm, value: 200}}

  - id: sofa_size_kept_on_price_change
    issue: "control: a size stays while refining the same type"
    turns: [{search: "show me sofas no wider than 200 cm"}, "under 5000 SAR please"]
    checks: {not_fallback: true, min_products: 1, max_price: 5000, max_dimension: {field: length_cm, value: 200}}

  # ── one-seat product types (chairs, stools, single-seater sofas) ─────────────
  - id: single_seater_type_change
    issue: "'make them single seater sofas' is a change of type, not a one-seat sofa"
    turns: [{search: "show me sofas under 5000 SAR"}, {search: "make them single seater sofas"}]
    checks: {not_fallback: true, min_products: 1, subcategory: single-seater-sofa, max_price: 5000}

  - id: sofa_for_one_new_search
    issue: "a sofa for one person is the single-seater type (a stated need: card first, 2026-09-28)"
    turns: ["I need a sofa for one person", {skip_card: true}]
    checks: {not_fallback: true, min_products: 1, subcategory: single-seater-sofa}

  - id: sofa_seats_not_carried_to_single_seaters
    issue: "a sofa's seat count does not hide every one-seat piece"
    turns: [{search: "show me sofas for 4 people"}, {search: "show me single seater sofas instead"}]
    checks: {not_fallback: true, min_products: 3, subcategory: single-seater-sofa}

  # ── zero results always leave a way forward ──────────────────────────────────
  - id: zero_results_offers_next_step
    issue: "issue 9: nothing matched everything, so offer what setting one part aside would find"
    turns: [{search: "show me modern sofas for 4 people under 6000 SAR, around 220 cm wide"}]
    checks: {not_fallback: true, mentions: ["without", "widen", "raise", "drop", "loosen", "relax", "set aside", "?"]}

  - id: zero_results_budget_next_step
    issue: "issue 9: a budget nothing meets"
    turns: [{search: "show me sofas under 500 SAR"}]
    checks: {not_fallback: true, mentions: ["start at", "starts at", "from", "?"]}

  # ── seat counts no single piece meets: ask the shape first, then combine ──────
  - id: seat_combo_asks_shape_first
    issue: "issue 4: one question first - which shape, with real from prices (no card: no single piece seats 8)"
    turns: ["I need a sofa for 8 people"]
    checks: {not_fallback: true, max_products: 0, card: false, mentions: ["from"]}

  - id: seat_combo_separate_sofas
    issue: "issue 4: two sofas together, all in the wished colour, within budget"
    turns: ["I am looking for a beige sofa under 5000 sar that can fit 8 people", "separate sofas please"]
    checks: {not_fallback: true, min_combinations: 2}

  - id: seat_combo_either
    issue: "issue 4: 'either' shows the best of every shape"
    turns: ["show me sofas for 9 people", "either is fine, show me both"]
    checks: {not_fallback: true, min_combinations: 2}

  - id: seat_combo_pick_second
    issue: "issue 4: 'I'll take the second option' saves that combination"
    turns: ["I need a sofa for 8 people", "separate sofas in beige", "I'll take the second option"]
    checks: {not_fallback: true, min_products: 2}

  - id: seat_combo_strict_colour_honest
    issue: "issue 4: a strict colour no combination meets is said plainly"
    turns: ["only purple sofas for 8 people, no other colour", "either is fine, show me both"]
    checks: {not_fallback: true, min_combinations: 1, admits_no_match: true}

  # ── one question per reply on ordinary searches ──────────────────────────────
  - id: follow_up_seats_for_sofas
    opening: "off"
    issue: "just show me sofas: products, with the folded card as the turn's only question (was a follow-up, 2026-09-28; 'show me sofas' asks its card first since 2026-09-29)"
    turns: ["just show me sofas, no questions"]
    checks: {not_fallback: true, min_products: 3, card_mode: narrow, card_asks: [type], no_follow_up: true}

  - id: follow_up_style_when_seats_known
    opening: "off"
    issue: "seats known: the card does not ask the kind again"
    turns: ["show me sofas for 4 people"]
    checks: {not_fallback: true, max_products: 0, card_mode: ask, card_skips: [type], card_asks: [budget]}

  - id: need_asks_seats_first
    opening: "off"
    issue: "a stated need gets the question card first - the kind (seats) among them (was one question, 2026-09-28)"
    turns: ["I need a sofa for the living room"]
    checks: {not_fallback: true, max_products: 0, card: true, card_asks: [type, budget]}

  - id: need_then_answer_searches
    issue: "answering the card in words finds sofas for that many, with no extra question"
    turns: ["I need a sofa for the living room", "there are 4 of us"]
    checks: {not_fallback: true, min_products: 3, subcategory: sofa, min_seats: 4, no_follow_up: true}

  - id: seat_combo_show_more_is_new
    issue: "'show more options' with combinations on screen shows new ones, never the same"
    turns: ["a beige sofa for 8 people under 5000 SAR", "separate sofas please", "show more options"]
    checks: {not_fallback: true, min_combinations: 1, new_combinations: true}

  - id: seat_combo_not_this_one
    issue: "'I don't like the second option' replaces only that one"
    turns: ["a beige sofa for 8 people under 5000 SAR", "separate sofas please", "I don't like the second option"]
    checks: {not_fallback: true, min_combinations: 2, drops_previous_combination: 2}

  # ── a room of chosen pieces: one question per turn, then the room ────────────
  - id: room_asks_budget_first
    issue: "room questions: budget first, nothing built yet"
    turns: ["I want to design my living room"]
    checks: {not_fallback: true, max_products: 0, mentions: ["spend", "budget"]}

  - id: room_offers_piece_chips
    issue: "room questions: after the budget, the pieces as chips"
    turns: ["I want to design my living room", "Under 12000 SAR"]
    checks: {not_fallback: true, piece_picker: true}

  - id: room_asks_how_many_after_pieces
    issue: "room questions: a living room asks how many will sit"
    turns: ["I want to design my living room", "Under 12000 SAR", "Choose for me"]
    checks: {not_fallback: true, mentions: ["how many", "people", "sit"]}

  - id: room_built_for_four
    issue: "room of chosen pieces: seating for exactly four, all chosen pieces"
    turns: ["I want to design my living room", "Under 12000 SAR", "Choose for me", "4 people", "beige"]
    checks: {not_fallback: true, room_status: complete, room_seats: 4, room_has: [center-table, carpet, service-table]}

  - id: room_built_for_nine_confirms_earlier
    issue: "a head count from a sofa search is the room's (phase 6: never asked again), then met exactly"
    turns: ["I am looking for a sofa for 9 people", "I want to design a living room"]
    checks: {not_fallback: true, mentions: ["9", "nine"], not_mentions: ["how many"]}

  - id: room_nine_people_seated
    issue: "nine people seated by a combination inside the room budget"
    turns: ["Design my living room, budget 12000 SAR, 9 people, grey, choose the pieces for me"]
    checks: {not_fallback: true, room_seats: 9}

  - id: room_tight_budget_names_missing
    issue: "a piece the budget cannot reach is named, never counted"
    turns: ["Design my living room", "3500 SAR", "Choose for me", "5 people", "beige"]
    checks: {not_fallback: true, not_mentions: ["1 needed piece", "remains to be resolved"]}

  - id: room_just_design_it
    issue: "'just design it' ends the questions and builds the room"
    turns: ["Furnish my bedroom, budget 8000 SAR", "just design it"]
    checks: {not_fallback: true, room_has: [bed, nightstand]}

  # ── the last branch fixes (2026-09-26) ──────────────────────────────────────
  - id: sofa_for_six_offers_sofa_set
    issue: "a sofa for 6: the sofa set that seats them, framed as the best fit"
    turns: [{search: "show me a sofa for 6 people"}]
    checks: {not_fallback: true, min_products: 1, subcategory: sofa-set, not_mentions: ["none of our", "no sofa", "don't have"]}

  - id: seat_combo_after_turning_down_the_set
    issue: "issue 21: 'not an L-shape, a simple sofa' for 7 asks the seating shape, never the sets again"
    turns: [{search: "show me a sofa for 7 people"}, "I dont want l shape sofa rather a simple sofa"]
    checks: {not_fallback: true, max_products: 0, mentions: ["from"]}

  - id: seat_combo_after_turning_down_the_set_shows
    issue: "issue 21: the chosen shape shows combinations, none built from the sets turned down"
    turns: [{search: "show me a sofa for 7 people"}, "I dont want l shape sofa rather a simple sofa", "a sofa with armchairs"]
    checks: {not_fallback: true, min_combinations: 1}

  - id: seat_combo_chosen_counts_its_quantities
    issue: "issue 22: two of one 4-seater chosen for 8 is settled seating, never 'one still to solve'"
    turns: ["I need a sofa for 8 people", "separate sofas arranged together", "i like option 2"]
    checks: {not_fallback: true, chosen_seating: true, min_products: 1, not_mentions: ["still to", "second sofa", "another sofa", "remaining"]}

  - id: seat_combo_tapped_choose_shows_what_goes_with
    issue: "issue 22: tapping Choose on a combination shows it and what goes with it"
    turns: ["I need a sofa for 8 people", "separate sofas arranged together", {combination: {op: choose, position: 1}}]
    checks: {not_fallback: true, chosen_seating: true, min_products: 1}

  - id: seat_combo_tapped_more_is_new
    issue: "issue 22: tapping Show more on combinations shows new ones"
    turns: ["I need a sofa for 8 people", "separate sofas arranged together", {combination: {op: more}}]
    checks: {not_fallback: true, min_combinations: 1, new_combinations: true}

  - id: seat_combo_tapped_not_this_one
    issue: "issue 22: tapping Not this one replaces just that combination"
    turns: ["I need a sofa for 8 people", "separate sofas arranged together", {combination: {op: dismiss, position: 2}}]
    checks: {not_fallback: true, min_combinations: 1, drops_previous_combination: 2}

  - id: seat_combo_over_budget_says_closest
    issue: "nothing seats 9 within budget: the closest real total is offered as a question"
    turns: ["sofas for 9 people under 1500 SAR"]
    checks: {not_fallback: true, max_products: 0, mentions: ["3,700", "3700"]}

