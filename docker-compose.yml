services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-zory-agent-backend}:${TAG:-local}
    env_file:
      - path: .env
        required: false
    environment:
      ZORY_ENVIRONMENT: local
      ZORY_REDIS__URL: redis://redis:6379/0
      ZORY_API__CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8010:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-zory-agent-frontend}:${TAG:-local}
    ports:
      - "3090:3000"
    depends_on:
      backend:
        condition: service_healthy
