# CODE - runtime, settle chain, language, failures (no agent owns these)
# ════════════════════════════════════════════════════════════════════════════
code:

  # ── turn shape ─────────────────────────────────────────────────────────────
  - id: code.turn.screen_action_no_model
    behaviour: "A tap (bundle, search, product, support action) is run in code with no decision model, on the same path the typed words take."
    source: {claude: ["3.6", "17.1"], cases: [follow_different_options_button, follow_not_this_one_button, seat_combo_tapped_more_is_new]}
    owner: code
    tool: screen_action
    lives_in: [code]
    today: [tc:_dispatch, tc:_run_bundle_action, tc:_run_search_action, tc:_run_product_action, tc:_run_support_action, _bundle_action_decision, _search_action_decision, _goes_with_decision, _compare_picks_decision]

  - id: code.turn.interaction_before_primary
    behaviour: "A pick in the same message is applied before the primary action, so it survives a search that replaces the screen."
    source: {claude: ["36"], cases: [pick_typed_with_a_kind_shows_it]}
    owner: code
    tool: add_to_cart
    lives_in: [code]
    today: [tc:_run_decided_turn -> tc:_apply_interaction]

  - id: code.turn.proposals_applied_once
    behaviour: "Stated facts (preferences, room budget, geometry, pieces) land in one transition after the primary action, never twice."
    source: {claude: ["19"], cases: []}
    owner: code
    tool: settle
    lives_in: [code]
    today: [proposal_mapping.map_proposals, tc:_run_decided_turn apply_update, _Primary.proposals_applied]

  - id: code.turn.ground_one_question
    behaviour: "When a turn produces several possible questions, one is chosen by priority, not by branch order."
    source: {claude: ["10.2"], cases: []}
    owner: code
    tool: settle
    lives_in: [code]
    today: [tc:_ground, grounding_builder.py]

  - id: code.turn.store_scope
    behaviour: "Store scope comes only from RetailerContext; no model output carries a store or product id."
    source: {claude: ["8", "20.2"], cases: []}
    owner: code
    tool: all
    lives_in: [code]
    today: [CustomerTurnInput.context, reference_resolver]

  - id: code.turn.selection_facts
    behaviour: "Every reply reports the picks tray, picked kinds and liked list from one fresh catalog read."
    source: {claude: ["10.7", "36"], cases: [typed_pick_lands_in_tray]}
    owner: code
    tool: settle
    lives_in: [code]
    today: [tc:_selection_facts]

  - id: code.turn.picks_endpoint
    behaviour: "Ticks, unticks, likes and quantities from POST /v1/picks change the cart silently with no turn."
    source: {claude: ["36", "10.7"], cases: [untick_empties_tray, like_is_silent_and_apart_from_picks]}
    owner: code
    tool: none (route)
    lives_in: [code]
    today: [routes/picks.py, picks.py]

  # ── post-steps in run() (the settle chain) ─────────────────────────────────
  - id: code.settle.live_swap
    behaviour: "While a room swap is live every reply says which piece its options are for; a swap no longer live is forgotten."
    source: {claude: ["10.3"], cases: []}
    owner: code
