# Behaviour inventory: the guard against losing behaviour when
# app/services/turn_coordinator.py (CustomerTurnCoordinator) and the decision
# model (customer_decision.py, CustomerAgentDecision) are replaced by the
# LangGraph supervisor and four agents (plan: no-i-want-it-quizzical-firefly.md).
#
# One entry per behaviour. Fields:
#   id         stable key, <owner>.<area>.<name>
#   behaviour  one plain sentence with a customer example
#   source     claude: CLAUDE.md sections; cases: evals/conversations/cases.yaml ids
#   owner      sara | nora | salman | faysal | code
#   tool       the planned tool (plan table) that carries it; "post-step" for the
#              settle chain; "screen_action" for a tap run in code; GAP:<name>
#              where no planned tool fits (listed again at the end)
#   lives_in   code | tool_result | prompt | reply_check (a list where it is split)
#   today      where it is implemented now (file:method); tc = app/services/turn_coordinator.py
#
# Every case id in cases.yaml appears in at least one entry's source.cases;
# `not_fallback` (checked by almost every case) is covered by code.fail.not_understood.

