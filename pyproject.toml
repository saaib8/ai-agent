[project]
name = "zory-agent"
version = "0.1.0"
description = "ZORY AI Commerce Agent - customer-facing commerce and interior-design agent service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118,<0.120",
    "uvicorn[standard]>=0.37,<0.40",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.11,<3",
    "sqlalchemy[asyncio]>=2.0.43,<2.1",
    "asyncpg>=0.30,<0.31",
    "redis>=6.4,<7",
    "structlog>=25.4,<26",
    "pyyaml>=6.0,<7",
    "openai>=2.0,<3",
]

[project.optional-dependencies]
# Only installed where secrets come from AWS Secrets Manager (stage/prod).
# Local and test runs resolve settings from .env and never import boto3.
aws = ["boto3>=1.40,<2"]
# Only installed where semantic ranking is enabled. With no Pinecone settings
# the adapter is never constructed and the SDK is never imported.
semantic = ["pinecone>=10,<11"]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
    "httpx>=0.28,<0.29",
    "ruff>=0.14,<0.15",
    "mypy>=1.18,<2",
    "types-PyYAML>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Tooling ──────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S", "TID"]
ignore = [
    "S101",  # assert: pytest relies on it
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # test fixtures carry obviously-fake credentials

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
files = ["app", "tests", "evals"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_unimported = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires live PostgreSQL/Redis (see docker-compose.yml)",
]
filterwarnings = ["error"]
